<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SKU 商品档案 - ShoeFlow</title>

    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/sales.css">
    <link rel="stylesheet" href="/static/css/records.css">
    <link rel="stylesheet" href="/static/css/sku_catalog.css">
</head>

<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">SF</div>

            <div>
                <div class="brand-name">ShoeFlow</div>
                <div class="brand-subtitle">库存经营系统</div>
            </div>
        </div>

        <nav class="nav-menu">
            <a class="nav-item" href="/">
                <span class="nav-icon">⌂</span>
                <span>经营首页</span>
            </a>

            <a class="nav-item" href="/inbound">
                <span class="nav-icon">▣</span>
                <span>扫码入库</span>
            </a>

            <a class="nav-item" href="/sales">
                <span class="nav-icon">◈</span>
                <span>销售出库</span>
            </a>

            <a class="nav-item" href="/returns">
                <span class="nav-icon">↶</span>
                <span>退货与冲销</span>
            </a>

            <a class="nav-item" href="/records">
                <span class="nav-icon">☷</span>
                <span>业务记录</span>
            </a>

            <a class="nav-item active" href="/sku-catalog">
                <span class="nav-icon">◇</span>
                <span>商品档案</span>
            </a>

            <a class="nav-item" href="/inventory-control">
                <span class="nav-icon">±</span>
                <span>库存校正</span>
            </a>

            <a class="nav-item" href="/#inventory">
                <span class="nav-icon">▦</span>
                <span>库存查询</span>
            </a>
        </nav>

        <a class="api-link" href="/docs" target="_blank">
            打开 API 文档
        </a>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>SKU 商品档案</h1>
                <p>查询品牌、货号、尺码、条码和商品状态</p>
            </div>

            <button
                id="refreshButton"
                class="primary-button"
                type="button"
            >
                刷新档案
            </button>
        </header>

        <div class="catalog-body">
            <div id="messageBox" class="message-box hidden"></div>

            <section class="catalog-tools">
                <div class="catalog-count">
                    共 <strong id="skuCount">0</strong> 个 SKU
                </div>

                <div class="catalog-filters">
                    <input
                        id="searchInput"
                        type="search"
                        placeholder="搜索品牌、货号、尺码或条码"
                    >

                    <select id="statusFilter">
                        <option value="">全部状态</option>
                        <option value="active">启用</option>
                        <option value="inactive">停用</option>
                        <option value="discontinued">已停产</option>
                    </select>
                </div>
            </section>

            <section class="catalog-card">
                <div class="table-wrapper">
                    <table class="catalog-table">
                        <thead>
                        <tr>
                            <th>品牌</th>
                            <th>货号</th>
                            <th>尺码</th>
                            <th>条码</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>

                        <tbody id="skuTableBody"></tbody>
                    </table>
                </div>

                <div id="emptyState" class="empty-state hidden">
                    没有找到符合条件的 SKU
                </div>
            </section>
        </div>
    </main>
</div>

<script src="/static/js/sku_catalog.js"></script>
</body>
</html>
